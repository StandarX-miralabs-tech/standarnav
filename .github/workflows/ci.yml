name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The runner is pinned rather than tracking `ubuntu-latest`, which migrates to Ubuntu 26
# on 2026-10-19. Every other form of drift here is already barred — build output, size
# budgets, the React, Vue and Svelte floors, the citation anchors — and an operating system that changes
# under the browser matrix with no commit to point at is the same class of problem.
# Moving it is a deliberate bump, reviewed like any other.
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # Every document cites the code by `path:line`, and those anchors drift the
      # moment a line is inserted above them. Two review passes shipped anchors
      # pointing at the wrong line before this existed.
      - run: bun run check:docs

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      # tsdown rewrites the exports map in package.json: a build must leave the tree
      # byte-identical, or the published map and the committed one have drifted apart.
      - name: No build drift
        run: git diff --exit-code
      - name: Lint the packed tarball
        run: bun run check:package
      - name: Size budgets
        run: bun run check:size

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run test:unit

  # `package.json` declares `react` and `react-dom` as optional peers at `>=18.3.0`,
  # while the lockfile pins 19 and every job above installs `--frozen-lockfile`. The
  # floor of that range was therefore never built, typechecked or run anywhere: a
  # promise the repository had no means of keeping. This job keeps it, or the range
  # gets narrowed to what is tested.
  react-floor:
    name: react 18.3 (the declared peer floor)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Install the declared floor
        run: bun add --dev react@^18.3.1 react-dom@^18.3.1 @types/react@^18.3 @types/react-dom@^18.3
      # The types are half the contract: 18 and 19 differ on `ReactNode` and on the
      # JSX namespace, and the provider's props are exported `.d.ts` surface.
      - run: bun run typecheck
      - name: Resolve the playwright version
        id: playwright
        run: echo "version=$(bun pm ls | grep -oP '(?<![-\w])playwright@\K[0-9.]+' | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}-chromium
      - run: bun x playwright install --with-deps chromium
      # One engine is enough here: what is under test is the React version, and the
      # browser matrix is covered by the job below.
      - run: bun run test:browser
        env:
          SNAV_BROWSER: chromium

  browser:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # The lookbehind is load-bearing: `bun pm ls` prints @vitest/browser-playwright
      # first, an unanchored pattern matches inside its tail, and the key would then carry
      # that package's version — never changing when playwright itself is bumped, and
      # restoring last release's browser binaries for this one.
      - name: Resolve the playwright version
        id: playwright
        run: echo "version=$(bun pm ls | grep -oP '(?<![-\w])playwright@\K[0-9.]+' | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      - run: bun x playwright install --with-deps ${{ matrix.browser }}
      - run: bun run test:browser
        env:
          SNAV_BROWSER: ${{ matrix.browser }}

  # The same promise for the Vue adapter, kept the same way. `vue` is an optional peer at
  # `>=3.3.0` while the lockfile pins 3.5: this job installs exactly 3.3.0, the release that
  # ships `toValue`, `MaybeRefOrGetter` and the function form of `defineComponent` the
  # adapter is written with (ADR-0027). Below the jobs it copies so that adding it moved no
  # line anything cites.
  vue-floor:
    name: vue 3.3.0 (the declared peer floor)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Install the declared floor
        run: bun add --dev vue@3.3.0
      # The adapter's exported types are written against what 3.3 declares, which is where
      # `defineComponent` over a setup function returned a plain function type.
      - run: bun run typecheck
      - name: Resolve the playwright version
        id: playwright
        run: echo "version=$(bun pm ls | grep -oP '(?<![-\w])playwright@\K[0-9.]+' | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}-chromium
      - run: bun x playwright install --with-deps chromium
      # One engine: what is under test is the Vue version, as in `react-floor`.
      - run: bun run test:browser
        env:
          SNAV_BROWSER: chromium

  # The same promise for the Svelte adapter. `svelte` is an optional peer at `>=5.0.0` while the
  # lockfile pins 5.57: this job installs exactly 5.0.0, the first release with everything the
  # adapter calls — `setContext`, `getContext`, `getAllContexts`, `onMount` and `untrack`, and
  # `writable`, `toStore` and `fromStore` from `svelte/store` (ADR-0028). The unit project runs
  # too, because the server render is there. `@sveltejs/vite-plugin-svelte` declares a newer svelte
  # peer and still compiles the test components on 5.0.0, which are plain JavaScript for that reason.
  svelte-floor:
    name: svelte 5.0.0 (the declared peer floor)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Install the declared floor
        run: bun add --dev svelte@5.0.0
      - run: bun run typecheck
      - run: bun run test:unit
      - name: Resolve the playwright version
        id: playwright
        run: echo "version=$(bun pm ls | grep -oP '(?<![-\w])playwright@\K[0-9.]+' | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}-chromium
      - run: bun x playwright install --with-deps chromium
      # One engine: what is under test is the Svelte version, as in `react-floor`.
      - run: bun run test:browser
        env:
          SNAV_BROWSER: chromium
